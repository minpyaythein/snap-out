<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snap Out</title>
    <link rel="stylesheet" href="popup.css" />
</head>
<body>
    <div class="container">
        <h1>Snap Out</h1>
        <p class="subtitle">Track sites you want to spend less time on.</p>

        <form id="add-form">
            <input
                type="text"
                id="site-input"
                placeholder="e.g. youtube.com"
                autocomplete="off"
                spellcheck="false"
            />
            <button type="submit">Add</button>
        </form>
        <p id="error-msg" class="error hidden"></p>

        <ul id="site-list"></ul>

        <div id="session-timer" class="session-timer hidden">
            <span id="session-hostname"></span>
            <span id="session-elapsed"></span>
        </div>

        <div class="duration-section">
            <div class="duration-header">
                <label>Alert after</label>
                <span id="duration-current"></span>
            </div>
            <div class="duration-inputs">
                <div class="duration-field">
                    <input type="number" id="duration-min" inputmode="numeric" min="0" max="30" step="1" value="5" />
                    <span>min</span>
                </div>
                <div class="duration-field">
                    <input type="number" id="duration-sec" inputmode="numeric" min="0" max="59" step="1" value="0" />
                    <span>sec</span>
                </div>
            </div>
            <button type="button" id="duration-apply">Apply</button>
        </div>

        <div class="difficulty-section">
            <label for="difficulty-select">Math difficulty</label>
            <select id="difficulty-select">
                <option value="none">None (just alert)</option>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
                <option value="very-hard">Very Hard</option>
                <option value="super-hard">Super Hard</option>
                <option value="impossible">Impossible</option>
            </select>
        </div>
    </div>
    <script src="../storage.js"></script>
    <script src="popup.js"></script>
</body>
</html>
